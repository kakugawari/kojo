<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ねこイライラ棒">
  <rect width="512" height="512" rx="112" fill="#231a35"/>
  <!-- コース: 中心線を太らせたもの -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128,110 L128,250 L300,250 L300,400 L400,400" stroke="#ff3d71" stroke-width="112" opacity=".28"/>
    <path d="M128,110 L128,250 L300,250 L300,400 L400,400" stroke="#ff3d71" stroke-width="96"/>
    <path d="M128,110 L128,250 L300,250 L300,400 L400,400" stroke="#fff6e8" stroke-width="72"/>
  </g>
  <!-- じゃまもの -->
  <rect x="196" y="196" width="26" height="108" rx="13" fill="#ffd23f" stroke="#1a1428" stroke-width="9"/>
  <!-- 棒 -->
  <line x1="128" y1="330" x2="128" y2="168" stroke="#7a5230" stroke-width="26" stroke-linecap="round"/>
  <line x1="128" y1="326" x2="128" y2="172" stroke="#e0a869" stroke-width="15" stroke-linecap="round"/>
  <circle cx="128" cy="344" r="26" fill="#7a5230" stroke="#e0a869" stroke-width="8"/>
  <!-- ねこの輪っか -->
  <g transform="translate(128 156) scale(2.05)">
    <path d="M-12,-11 L-15.5,-19 L-6,-14.5 Z" fill="#fff6e8" stroke="#231a35" stroke-width="3" stroke-linejoin="round"/>
    <path d="M12,-11 L15.5,-19 L6,-14.5 Z" fill="#fff6e8" stroke="#231a35" stroke-width="3" stroke-linejoin="round"/>
    <circle r="21" fill="#fffaf2" stroke="#231a35" stroke-width="7"/>
    <circle r="18.6" fill="none" stroke="#fff6e8" stroke-width="4.4"/>
    <ellipse cx="-9.4" cy="3.2" rx="3" ry="2" fill="#ff9dbb"/>
    <ellipse cx="9.4" cy="3.2" rx="3" ry="2" fill="#ff9dbb"/>
    <circle cx="-5" cy="-1" r="2.3" fill="#3a2f52"/>
    <circle cx="5" cy="-1" r="2.3" fill="#3a2f52"/>
    <path d="M0,3.4 q-2.4,2.4 -4.4,.2 M0,3.4 q2.4,2.4 4.4,.2" fill="none" stroke="#3a2f52" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- GOAL のしるし -->
  <circle cx="400" cy="400" r="40" fill="none" stroke="#ffd23f" stroke-width="12"/>
