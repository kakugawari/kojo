<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="イライラ棒工場">
  <defs>
    <pattern id="st" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="34" height="34" fill="#f5c33c"/>
      <rect width="17" height="34" fill="#1b2029"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="112" fill="#12151d"/>
  <!-- 検査台のプレート -->
  <rect x="36" y="36" width="440" height="440" rx="78" fill="#2d364d" stroke="#5a6883" stroke-width="10"/>
  <rect x="48" y="120" width="20" height="272" rx="10" fill="url(#st)" opacity=".85"/>
  <rect x="444" y="120" width="20" height="272" rx="10" fill="url(#st)" opacity=".85"/>
  <g fill="#5e6a82">
    <circle cx="92" cy="92" r="11"/><circle cx="420" cy="92" r="11"/>
    <circle cx="92" cy="420" r="11"/><circle cx="420" cy="420" r="11"/>
  </g>
  <!-- ユニットのみぞ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168,136 L168,262 L318,262 L318,384 L382,384" stroke="#ff3d5f" stroke-width="104" opacity=".26"/>
    <path d="M168,136 L168,262 L318,262 L318,384 L382,384" stroke="#ff3d5f" stroke-width="90"/>
    <path d="M168,136 L168,262 L318,262 L318,384 L382,384" stroke="#f0ece2" stroke-width="66"/>
  </g>
  <!-- 可動部 -->
  <rect x="228" y="206" width="26" height="112" rx="13" fill="#ffd23f" stroke="#11141c" stroke-width="9"/>
  <!-- テスト棒 -->
  <line x1="168" y1="352" x2="168" y2="196" stroke="#11141c" stroke-width="32" stroke-linecap="round"/>
  <line x1="168" y1="348" x2="168" y2="200" stroke="#b9c2cf" stroke-width="18" stroke-linecap="round"/>
  <line x1="168" y1="352" x2="168" y2="292" stroke="#333b4d" stroke-width="32" stroke-linecap="round"/>
  <circle cx="168" cy="362" r="28" fill="#333b4d" stroke="#5c6880" stroke-width="6"/>
  <!-- リング (外径が当たり判定) -->
  <circle cx="168" cy="154" r="38" fill="none" stroke="#11141c" stroke-width="20"/>
  <circle cx="168" cy="154" r="38" fill="none" stroke="#dfe6f0" stroke-width="12"/>
  <!-- GOAL 端子 -->
  <circle cx="382" cy="384" r="36" fill="none" stroke="#ffd23f" stroke-width="11" stroke-dasharray="17 11"/>
