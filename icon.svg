<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="イライラ棒工場">
  <rect width="512" height="512" rx="112" fill="#06070d"/>
  <g fill="#ffffff">
    <circle cx="92" cy="106" r="3" opacity=".5"/><circle cx="410" cy="88" r="2.4" opacity=".4"/>
    <circle cx="150" cy="412" r="2.6" opacity=".45"/><circle cx="446" cy="360" r="3" opacity=".35"/>
    <circle cx="330" cy="150" r="2" opacity=".3"/><circle cx="72" cy="300" r="2.2" opacity=".35"/>
  </g>
  <!-- ネオン管のみぞ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150,180 L330,180 L330,330 L430,330" stroke="#ff3d5f" stroke-width="152" opacity=".10"/>
    <path d="M150,180 L330,180 L330,330 L430,330" stroke="#ff3d5f" stroke-width="128" opacity=".2"/>
    <path d="M150,180 L330,180 L330,330 L430,330" stroke="#ff3d5f" stroke-width="112" opacity=".4"/>
    <path d="M150,180 L330,180 L330,330 L430,330" stroke="#ff3d5f" stroke-width="100"/>
    <path d="M150,180 L330,180 L330,330 L430,330" stroke="#06070d" stroke-width="78"/>
  </g>
  <!-- 可動部 -->
  <rect x="236" y="130" width="24" height="100" rx="12" fill="#ffd23f" stroke="#06070d" stroke-width="10"/>
  <!-- テスト棒 -->
  <line x1="150" y1="380" x2="150" y2="230" stroke="#11141c" stroke-width="34" stroke-linecap="round"/>
  <line x1="150" y1="376" x2="150" y2="234" stroke="#b9c2cf" stroke-width="19" stroke-linecap="round"/>
  <line x1="150" y1="380" x2="150" y2="322" stroke="#333b4d" stroke-width="34" stroke-linecap="round"/>
  <circle cx="150" cy="392" r="29" fill="#333b4d" stroke="#5c6880" stroke-width="7"/>
  <!-- リング (外径が当たり判定) -->
  <circle cx="150" cy="180" r="44" fill="none" stroke="#dfe6f0" stroke-width="30" opacity=".16"/>
  <circle cx="150" cy="180" r="44" fill="none" stroke="#11141c" stroke-width="22"/>
  <circle cx="150" cy="180" r="44" fill="none" stroke="#dfe6f0" stroke-width="13"/>
  <!-- GOAL 端子 -->
  <circle cx="430" cy="330" r="40" fill="none" stroke="#ffd23f" stroke-width="10" stroke-dasharray="18 12"/>
