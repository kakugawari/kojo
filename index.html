<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ねこイライラ棒</title>
<meta name="description" content="ねこの輪っかを、カベに当てずにゴールまで運ぶゲーム">
<meta name="theme-color" content="#231a35">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app" data-mode="ready">

  <svg id="board" aria-label="コース">
    <defs id="boardDefs">
      <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="1.6" fill="rgba(255,255,255,.07)"></circle>
      </pattern>
    </defs>
    <rect id="bg" x="0" y="0" width="100%" height="100%"></rect>
    <rect id="bgDots" x="0" y="0" width="100%" height="100%" fill="url(#dots)"></rect>
    <g id="gripZone"></g>
    <g id="course"></g>
    <g id="hazards"></g>
    <g id="player">
      <line id="stick" x1="0" y1="0" x2="0" y2="0"></line>
      <g id="grip"></g>
      <g id="ring"></g>
    </g>
    <g id="fx"></g>
  </svg>

  <header id="hud">
    <button type="button" id="btnStages" class="chip chip-btn" aria-label="ステージをえらぶ">☰</button>
    <div class="chip chip-name"><b id="stageName">—</b></div>
    <div class="chip chip-time"><span>⏱</span><b id="time">0.00</b></div>
    <div class="chip chip-best"><span>★</span><b id="best">--.--</b></div>
    <button type="button" id="btnSound" class="chip chip-btn" aria-label="音">🔊</button>
  </header>

  <div id="progress"><i id="progressBar"></i></div>

  <div id="overlay" aria-live="polite"></div>

  <div id="sheetWrap" hidden>
    <div id="sheetBack"></div>
    <section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <h2 id="sheetTitle">ステージ</h2>
        <button type="button" id="sheetClose" class="round-btn" aria-label="とじる">✕</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </section>
  </div>

</div>

<script src="./core.js"></script>
<script src="./app.js"></script>
</body>
</html>
