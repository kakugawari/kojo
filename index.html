<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>イライラ棒工場</title>
<meta name="description" content="イライラ棒をつくる工場の検査ライン。テスト棒でコースを通す">
<meta name="theme-color" content="#231a35">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app" data-mode="ready">

  <svg id="board" aria-label="検査するユニット">
    <defs id="boardDefs">
      <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="1.6" fill="rgba(255,255,255,.055)"></circle>
      </pattern>
      <radialGradient id="lightGrad">
        <stop offset="0%" stop-color="#000000"></stop>
        <stop offset="54%" stop-color="#000000"></stop>
        <stop offset="100%" stop-color="#ffffff"></stop>
      </radialGradient>
      <mask id="darkMask" maskUnits="userSpaceOnUse">
        <rect id="darkAll" x="0" y="0" width="100%" height="100%" fill="#ffffff"></rect>
        <circle id="lightHole" cx="0" cy="0" r="150" fill="url(#lightGrad)"></circle>
      </mask>
      <pattern id="stripes" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="26" height="26" fill="#f5c33c"></rect>
        <rect width="13" height="26" fill="#1b2029"></rect>
      </pattern>
    </defs>
    <rect id="bg" x="0" y="0" width="100%" height="100%"></rect>
    <g id="panel"></g>
    <g id="gripZone"></g>
    <g id="course"></g>
    <g id="hazards"></g>
    <!-- 暗室検査。手もとの明かりのぶんだけ、この幕に穴があく -->
    <rect id="dark" x="0" y="0" width="100%" height="100%" fill="#080a10" opacity=".985"
          mask="url(#darkMask)" pointer-events="none" display="none"></rect>
    <g id="player">
      <line id="rodBack" x1="0" y1="0" x2="0" y2="0"></line>
      <line id="rod" x1="0" y1="0" x2="0" y2="0"></line>
      <line id="handle" x1="0" y1="0" x2="0" y2="0"></line>
      <g id="grip"></g>
      <g id="ring"></g>
    </g>
    <g id="fx"></g>
  </svg>

  <header id="hud">
    <button type="button" id="btnStages" class="chip chip-btn" aria-label="検査ラインを見る">☰</button>
    <div class="chip chip-name"><b id="stageName">—</b></div>
    <div class="chip chip-time"><b id="time">0.00</b><span class="best-in">★<b id="best">--.--</b></span></div>
    <button type="button" id="btnDark" class="chip chip-btn" aria-label="手もとだけ照らす">🔦</button>
    <button type="button" id="btnSound" class="chip chip-btn" aria-label="音">🔊</button>
  </header>

  <div id="progress"><i id="progressBar"></i></div>

  <div id="overlay" aria-live="polite"></div>

  <div id="rotate">
    <div class="rotate-box">
      <div class="rotate-ico">📱</div>
      <h2>画面を横にしてください</h2>
      <p>検査台は横長です。スマホを横向きにすると全部見えます。</p>
      <button type="button" id="btnStay" class="btn alt">このまま遊ぶ</button>
    </div>
  </div>

  <div id="sheetWrap" hidden>
    <div id="sheetBack"></div>
    <section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <h2 id="sheetTitle">検査ライン</h2>
        <button type="button" id="sheetClose" class="round-btn" aria-label="とじる">✕</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </section>
  </div>

</div>

<script src="./core.js"></script>
<script src="./app.js"></script>
</body>
</html>
